# Publishes release/turntapod.bin and release/manifest.txt as the GitHub release
# v<version> (version read from manifest.txt), unless that release already exists.
name: Publish firmware release
on:
  push:
    paths: ["release/**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the image against its manifest
        run: |
          set -eu
          v=$(sed -n 's/^version=//p' release/manifest.txt)
          [ "$(sed -n 's/^size=//p' release/manifest.txt)" = "$(wc -c < release/turntapod.bin | tr -d ' ')" ]
          [ "$(sed -n 's/^sha256=//p' release/manifest.txt)" = "$(sha256sum release/turntapod.bin | cut -d' ' -f1)" ]
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then echo "v$VERSION already exists"; exit 0; fi
          gh release create "v$VERSION" release/turntapod.bin release/manifest.txt \
            --target "$GITHUB_SHA" --latest \
            --title "Turntapod $VERSION" \
            --notes "Firmware $VERSION for the Turntapod turntable (code commit $(cat release/commit.txt 2>/dev/null || echo unknown)). Install it from the turntable's web page: Settings → Check for update."
